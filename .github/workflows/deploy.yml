name: Deploy to hybridtech-eg.com
# Builds the site and uploads dist/ to the client's data4host server (CWP panel) over FTPS.
# Only changed files are sent: the action keeps .ftp-deploy-sync-state.json next to the site.
# Needs repo secrets FTP_USERNAME and FTP_PASSWORD (the CWP panel / FTP login).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # never cancel an upload half way; queue the next one instead
  group: ftp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hybridtech-eg.com/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server.data4host.com
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
